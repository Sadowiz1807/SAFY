schema_version: 3
source_of_truth: Agent/agent_runtime.py runtime tool registry
notes: >-
  This file mirrors the active AgentRuntime registry. It documents capability
  and policy; it does not grant permission independently of SQL Guard,
  QueryOrchestrator, driver capability, sandbox readiness, or user confirmation.
real_sandbox_execution: true
real_database_execution: true
toolsets:
  sql:
    enabled: true
    tools:
      - sql.guard
  database:
    enabled: true
    tools:
      - database.read
      - database.execute
  sandbox:
    enabled: true
    tools:
      - sandbox.validate
  schema:
    enabled: true
    tools:
      - schema.graph.read
  domain:
    enabled: true
    tools:
      - domain.context
      - domain.schema.design
  ui:
    enabled: true
    tools:
      - execute_box.set_draft
policy:
  read_only_direct:
    enabled: true
    requires_sandbox: false
  domain_schema_preview:
    enabled: true
    executable: false
  write_and_non_destructive_ddl:
    enabled: true
    requires_sandbox: true
    confirmation_boundary: explicit_execute_button_after_sandbox_pass
  destructive_sql:
    enabled: false
    action: block_by_default
