      - Docs/Hermes_Execution/PHASE_1_VALIDATION_CHECKLIST.md
      - Safy_Docs/02_API_SPEC.md
      - Safy_Docs/05_SECURITY_POLICY.md
    allowed_paths:
      - Apps/Api/
      - Gateway/
      - Contracts/
      - Docs/Hermes_Execution/
    must_not_modify:
      - Core/
      - Providers/
      - Skills/
      - Guard/
      - Tools/
      - Sandbox/
      - Database/
      - Apps/Web/
      - DataStore/
      - State/
      - Audit/
      - Logging/
    requirements:
      - Create FastAPI skeleton and Pydantic schemas for Phase 1 mock API.
      - Implement common success and error response envelope contracts.
      - Mock endpoints GET /profiles and GET /sandbox/health.
      - Mock endpoints POST /chat/new and POST /agent/chat.
      - Mock endpoints POST /query/check and POST /query/execute as primary right-sidebar query contracts.
      - Mock endpoints POST /profiles/model/save, POST /profiles/model/test, POST /profiles/database/save, POST /profiles/database/test.
      - /query/check must never execute SQL.
      - /query/check must return Safety Report.
      - High-risk /query/check must return visible backend-generated 4-digit numeric confirmation_code.
      - confirmation_code must be shown to UI, not generated by LLM, and bound to check_id + SQL hash + target + expiry.
      - /query/execute must require check_id, Yes decision, and valid confirmation_code when high-risk.
      - Wrong, expired, missing, or mismatched code must block execution.
      - If selected DB credential lacks permission, return DB_PERMISSION_DENIED.
      - Mock responses must not include raw API keys or raw DB passwords.
      - /manual-sql/execute may remain compatibility/future alias only, not the primary Phase 1 right-sidebar contract.
    acceptance_criteria:
      - All mock endpoints return common response envelope.
      - /profiles returns model and database profile mock data with masked secrets.
      - /agent/chat returns mock technical agent response with generated SQL and schema summary.
      - /query/check returns low-risk report for SELECT.
      - /query/check returns high-risk report and visible 4-digit confirmation_code for DELETE, DROP, UPDATE, or ALTER.
      - /query/check does not execute SQL.
      - /query/execute rejects missing check_id.
      - /query/execute rejects missing, invalid, expired, or mismatched code for high-risk mock.
      - Error codes are normalized.
      - No raw secrets appear in mock response, logs, or docs.
    validation_gate: Phase 1 API Mock Contract Gate
    handoff_artifact: Docs/Hermes_Execution/report/P1-API-MOCK-001.md
    definition_of_done:
      - Mock API skeleton and schemas exist under allowed paths.
      - Required endpoint contracts are documented or implemented as mock routes.
      - Contract examples match PHASE_1_CONTRACTS.md and PHASE_1_API_MOCK_SPEC.md.
      - Handoff artifact summarizes files changed, validation run, and known limitations.

