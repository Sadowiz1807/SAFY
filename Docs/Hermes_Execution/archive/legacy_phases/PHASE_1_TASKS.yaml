    requirements:
      - Create chat-first UI shell that can run against mock API.
      - Header must show Safy name/logo, model status, database status, and sandbox status.
      - left sidebar must include new session, session history, model connection, database connection, and settings.
      - Main chat area must include messages, prompt input, agent response, and technical output.
      - Right sidebar must include agent result panel, workflow status, SQL panels, schema summary, user query box, Check button, Safety Report panel, Yes/No controls, 4-digit code input, and execution result/error panel.
      - Model connection modal must include profile_name, provider, base_url, model, api_key, temperature, max_tokens, save, and test controls.
      - Database connection modal must include profile_name, dbms, host, port, database, username, password, ssl, user_query_access_mode, save, and test controls.
      - UI must call /query/check before /query/execute.
      - UI must display visible backend confirmation_code for high-risk results.
      - UI must disable high-risk execute until user selects Yes and enters the 4-digit code.
      - UI must handle normalized error responses including DB_PERMISSION_DENIED and confirmation code errors.
      - UI must not display raw secrets returned from any response.
    acceptance_criteria:
      - UI runs with mock API.
      - User can open model connection modal.
      - User can open database connection modal.
      - User can see session history area.
      - User can send mock chat prompt.
      - UI renders mock generated SQL and schema summary.
      - User can enter SQL in right sidebar query box.
      - UI calls mock /query/check.
      - UI displays high-risk confirmation_code from backend.
      - UI allows user to type 4-digit code.
      - UI calls /query/execute with check_id and code after Yes decision.
      - UI handles error responses.
    validation_gate: Phase 1 UI Contract Gate
    handoff_artifact: Docs/Hermes_Execution/report/P1-UI-SHELL-001.md
