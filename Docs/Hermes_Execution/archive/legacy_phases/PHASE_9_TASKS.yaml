    pass: pass_2
    status: complete
    risk_level: high
    dependencies: ["P9-P2-01", "P9-P2-02", "P9-P2-03"]
    acceptance_criteria: ["Phase 1-9 suite passes", "No result rows persisted", "No raw secrets persisted", "INSERT blocked"]
    rollback: "Revert JSON storage switch and restore backups."
  - id: P9-5-UI-01
    title: "Dashboard real runtime API integration"
