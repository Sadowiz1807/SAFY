phase: 5
title: Connected Database Read-only Agent Query and User Query Execution
status: ready_for_implementation
implementation_allowed: true
no_phase_6: true

invariants:
  - SQL Guard is mandatory for every agent and user SQL path.
  - /query/check never executes SQL.
  - /query/execute requires a valid prior check.
  - Agent connected database execution is read-only only.
  - Agent destructive connected database SQL is always blocked.
  - Raw secrets are never stored, logged, audited, or returned.
  - High-risk confirmation codes are backend-generated, hash-bound, profile-bound, one-time, expiring, and audited.

tasks:
  - id: P5-001
    title: Freeze Phase 5 API and safety contracts
    owner: main-agent
    status: planned
    deliverables:
      - Docs/Hermes_Execution/PHASE_5_CONTRACTS.md
      - Docs/Hermes_Execution/PHASE_5_API_SPEC.md
    acceptance:
      - Contracts separate agent path from user query path.
      - Contracts explicitly forbid connected database destructive execution by agent.

  - id: P5-002
    title: Add connected database read-only adapter interface
    owner: main-agent
    status: planned
    blocked_by:
      - P5-001
    acceptance:
      - Adapter accepts profile references only, not raw credentials in responses or audits.
      - Adapter rejects non-read-only statements before database access.
      - Tests prove no SQL executes when SQL Guard blocks.

  - id: P5-003
    title: Add agent connected database read-only query route
    owner: main-agent
    status: planned
    blocked_by:
      - P5-001
      - P5-002
    acceptance:
      - Agent can answer schema/data questions with read-only SQL only.
      - Agent DML, DDL, DROP, ALTER, TRUNCATE, INSERT, UPDATE, DELETE, MERGE, admin, and multi-statement mutation prompts are blocked.
      - Audit records redacted intent, target, profile id, SQL hash, and decision.

  - id: P5-004
    title: Harden user /query/check state binding
    owner: main-agent
    status: planned
    acceptance:
      - Check state binds check_id, sql_hash, target, database_profile_id, permission mode, risk level, and expiry.
      - Check state does not contain raw passwords, API keys, tokens, or connection strings.
      - Check state cannot be reused after successful execution or cancellation.

  - id: P5-005
    title: Implement backend confirmation code contract
    owner: main-agent
    status: planned
    acceptance:
      - Code is generated only by backend trusted state.
      - Code is bound to check_id, sql_hash, target, database_profile_id, and expiry.
      - Code is one-time and audited.
      - Wrong, missing, expired, reused, mismatched-profile, and mismatched-hash codes block execution.

  - id: P5-006
    title: Add user connected database execution path after check
    owner: main-agent
    status: planned
    blocked_by:
      - P5-002
      - P5-004
      - P5-005
    acceptance:
      - /query/execute fails closed without valid prior /query/check.
      - Read-only queries can execute only when profile permission allows.
      - High-risk user SQL requires valid confirmation code when policy allows user-controlled execution.
      - Blocked SQL never reaches the connected adapter.

  - id: P5-007
    title: Update static UI for Phase 5 safety displays
    owner: main-agent
    status: planned
    acceptance:
      - UI sends consistent check_id, sql_hash, target, and database_profile_id.
      - UI displays risk, confirmation, audit id, and result summaries safely with textContent or escaped rendering.
      - UI does not show raw backend tracebacks or raw secrets.

  - id: P5-008
    title: Add Phase 5 tests and validation report
    owner: main-agent
    status: planned
    blocked_by:
      - P5-003
      - P5-006
      - P5-007
    acceptance:
      - Unit, API, and smoke tests cover all security boundaries.
      - Validation output is recorded without fabricated results.
      - Phase 5 implementation status is updated only after tests pass.
