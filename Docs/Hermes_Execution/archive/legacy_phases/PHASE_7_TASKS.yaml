phase: 7
name: "Final Integration, Hardening, and Release Readiness"
status: ready_for_implementation
implementation_allowed: true
execution_mode: main_agent_only
sub_agents_allowed: false
requires_user_review_before_implementation: false
real_connected_db_adapter_allowed: false
agent_destructive_connected_db_allowed: false
phase_6_baseline_required: true

# Executed by main-agent only. No sub-agents used.
task_groups:
  - id: P7-001
    title: Baseline verification
    status: planned
    risk_level: low
    dependencies: ["Phase 6 committed baseline"]
    acceptance_criteria:
      - Phase 6 final and consistency reports exist.
      - Tests/phase6 exists.
      - Phase 6 status and validation counts are cited from repository files.
  - id: P7-002
    title: Cross-phase contract audit
    status: planned
    risk_level: medium
    dependencies: ["P7-001"]
    acceptance_criteria:
      - Phase 1 through Phase 6 contracts are consolidated.
      - No contract weakens SQL Guard, confirmation, recovery, workspace, audit, or redaction boundaries.
  - id: P7-003
    title: API envelope consistency
    status: planned
    risk_level: medium
    dependencies: ["P7-002"]
    acceptance_criteria:
      - Existing endpoint groups return the standard SAFY envelope.
      - Error shape and code normalization gaps are listed for user-approved implementation.
  - id: P7-004
    title: UI/backend consistency
    status: planned
    risk_level: medium
    dependencies: ["P7-003"]
    acceptance_criteria:
      - UI states match backend status, safety, and mock/preview/deferred meanings.
      - Unsafe actions have clear disabled/error states.
  - id: P7-005
    title: Audit/redaction audit
    status: planned
    risk_level: high
    dependencies: ["P7-002"]
    acceptance_criteria:
      - Session, workspace, recovery, audit, logs, reports, and UI outputs are checked for raw secrets.
      - Redaction gaps are documented without exposing secret values.
  - id: P7-006
    title: Recovery/workspace safety audit
    status: planned
    risk_level: high
    dependencies: ["P7-002"]
    acceptance_criteria:
      - Recovery cannot revive expired/consumed checks or confirmation codes.
      - Active locked workspace cleanup remains blocked and fail-closed.
  - id: P7-007
    title: End-to-end validation planning
    status: planned
    risk_level: medium
    dependencies: ["P7-003", "P7-004", "P7-005", "P7-006"]
    acceptance_criteria:
      - Full static, pytest, UI, secret scan, audit scan, and release checklist commands are defined.
  - id: P7-008
    title: Test suite consolidation
    status: planned
    risk_level: medium
    dependencies: ["P7-007"]
    acceptance_criteria:
      - Existing phase suites are preserved.
      - Planned Phase 7 tests are described before executable tests are created.
  - id: P7-009
    title: Documentation cleanup
    status: planned
    risk_level: low
    dependencies: ["P7-002"]
    acceptance_criteria:
      - Canonical report paths are consistent.
      - Historical notes are not treated as final Phase 7 evidence.
  - id: P7-010
    title: Release-readiness checklist
    status: planned
    risk_level: medium
    dependencies: ["P7-007", "P7-009"]
    acceptance_criteria:
      - Release criteria, known warnings, limitations, and user review gate are complete.
  - id: P7-011
    title: Final acceptance criteria
    status: planned
    risk_level: high
    dependencies: ["P7-010"]
    acceptance_criteria:
      - Full suite exits 0 in future implementation validation.
      - No out-of-scope item is implemented without separate user approval.
