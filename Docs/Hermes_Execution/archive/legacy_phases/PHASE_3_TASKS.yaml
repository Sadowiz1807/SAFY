phase: 3
project: Safy
execution_mode: single_main_agent_only
execution_boundary: BLOCKED_BY_PHASE_2_DELTA_AND_EXPLICIT_USER_APPROVAL
dispatch_policy: do_not_dispatch_without_explicit_user_approval
status_vocabulary:
  - READY_TO_IMPLEMENT
  - BLOCKED_BY_PHASE_2_DELTA
  - BLOCKED_BY_USER_DECISION
  - DOCUMENTATION_ONLY
  - DEFERRED
tasks:
  - task_id: P3-DOCS-PLAN-001
    goal: Create coherent Phase 3 planning, contract, security, task, validation, review, and report artifacts without code implementation overclaim.
    dependencies:
      - SAFY_source.md
      - PHASE_2_PLAN.md
      - PHASE_2_CONTRACTS.md
      - PHASE_2_DATA_SCHEMA_SPEC.md
      - PHASE_2_SECURITY_SPEC.md
      - PHASE_2_IMPLEMENTATION_DELTA_PLAN.md
    blocked_if:
      - required Phase 2 files cannot be read
      - user withdraws single-agent approval
    affected_files:
      - Docs/Hermes_Execution/PHASE_3_RESTATEMENT.md
      - Docs/Hermes_Execution/PHASE_3_FRAMEWORK_COMPARISON.md
      - Docs/Hermes_Execution/PHASE_3_PLAN.md
      - Docs/Hermes_Execution/PHASE_3_TASKS.yaml
      - Docs/Hermes_Execution/PHASE_3_CONTRACTS.md
      - Docs/Hermes_Execution/PHASE_3_SECURITY_SPEC.md
      - Docs/Hermes_Execution/PHASE_3_VALIDATION_CHECKLIST.md
      - Docs/Hermes_Execution/report/phase_3_reports_when_needed.md
    allowed_paths:
      - Docs/Hermes_Execution/
    must_not_modify:
      - Apps/
      - Audit/
      - Configs/
      - Core/
      - Data/
      - DataStore/
      - Database/
      - Gateway/
      - Guard/
      - Logging/
      - Providers/
      - Sandbox/
      - Skills/
      - State/
      - Tools/
    inputs:
      - Phase 3 single-agent execution prompt
      - Current canonical docs
    outputs:
      - Phase 3 documentation artifacts
    implementation_steps:
      - Read required Phase 2 and Phase 3 artifacts directly.
      - Record missing Phase 3 files as NOT_FOUND.
      - Create restatement.
      - Compare against framework.
      - Create or improve Phase 3 plan/contracts/tasks/security/checklist.
      - Execute documentation-only task.
      - Run two simulated read-only review passes when needed.
      - Create reports under Docs/Hermes_Execution/report/ when needed.
    acceptance_criteria:
      - No real sub-agent used.
      - No code implementation overclaimed.
      - Blocked tasks remain blocked.
      - Final report uses required status vocabulary.
    test_cases:
      - Verify artifact existence.
      - Verify blocked tasks are not marked ready.
      - Verify no Phase 2 NOT_VERIFIED dependency is assumed.
    test_commands:
      - manual_doc_review
    evidence_artifact: Docs/Hermes_Execution/report/phase_3_documentation_evidence_when_needed.md
    rollback_strategy: Remove newly created Phase 3 documentation artifacts if user requests rollback.
    definition_of_done: All required Phase 3 core documentation artifacts are created and status is honest; reports are evidence only.
    status: READY_TO_IMPLEMENT

  - task_id: P3-DELTA-PREREQ-001
    goal: Complete Phase 2 delta prerequisites required before runtime Phase 3 implementation.
    dependencies:
      - PHASE_2_IMPLEMENTATION_DELTA_PLAN.md
    blocked_if:
      - runtime/audit schema v2 remains NOT_VERIFIED
      - atomic validate_and_reserve remains NOT_VERIFIED
      - audit repair fields/transitions remain NOT_VERIFIED
      - user_query_access_mode migration remains NOT_VERIFIED
    affected_files:
      - State/runtime_db.py
      - State/high_risk_code_state.py
      - Audit/audit_store.py
      - Audit/audit_logger.py
      - DataStore/profile_store.py
      - Tests/phase2/
    allowed_paths:
      - State/
      - Audit/
      - DataStore/
      - Tests/
      - Docs/Hermes_Execution/
    must_not_modify:
      - Apps/Web/
      - Apps/Api/
      - Providers/
      - Skills/
      - Sandbox/
      - Database/
    inputs:
      - PHASE_2_IMPLEMENTATION_DELTA_PLAN.md
    outputs:
      - Verified Phase 2 delta evidence
    implementation_steps:
      - Convert Phase 2 delta plan into separate user-approved implementation task contracts.
      - Implement only after explicit approval.
      - Record tests and evidence.
    acceptance_criteria:
      - Phase 2 delta items have direct implementation and test evidence.
    test_cases:
      - Schema migration tests
      - Atomic confirmation replay tests
      - Audit repair transition tests
    test_commands:
      - to_be_defined_after_user_approval
    evidence_artifact: Docs/Hermes_Execution/PHASE_2_IMPLEMENTATION_DELTA_EVIDENCE.md
    rollback_strategy: Revert only files changed by the approved delta implementation task.
    definition_of_done: Phase 2 final refinements are no longer NOT_VERIFIED.
    status: BLOCKED_BY_PHASE_2_DELTA

  - task_id: P3-RUNTIME-ORCHESTRATION-001
    goal: Implement Phase 3 runtime orchestration using provenance, schema snapshots, workspace locks, and schema v2 state.
    dependencies:
      - P3-DELTA-PREREQ-001
    blocked_if:
      - workflow_object_provenance is NOT_VERIFIED
      - schema_snapshots is NOT_VERIFIED
      - workspace_locks is NOT_VERIFIED
      - runtime/audit schema v2 is NOT_VERIFIED
    affected_files:
      - State/
      - Core/
      - Sandbox/
      - Docs/Hermes_Execution/
    allowed_paths:
      - State/
      - Core/
      - Sandbox/
      - Tests/
      - Docs/Hermes_Execution/
    must_not_modify:
      - DataStore/profile files without migration contract
      - real connected database data
    inputs:
      - PHASE_3_CONTRACTS.md
      - PHASE_3_SECURITY_SPEC.md
    outputs:
      - Runtime orchestration implementation and evidence
    implementation_steps:
      - Wait for Phase 2 delta verification.
      - Implement orchestration in a user-approved task.
      - Test without real external providers or destructive DB operations.
    acceptance_criteria:
      - Orchestration passes tests and respects locks/provenance/snapshots.
    test_cases:
      - Lock acquisition/release
      - Snapshot invalidation
      - Provenance lookup
    test_commands:
      - to_be_defined_after_prerequisites
    evidence_artifact: Docs/Hermes_Execution/PHASE_3_RUNTIME_ORCHESTRATION_EVIDENCE.md
    rollback_strategy: Revert approved task files only.
    definition_of_done: Runtime orchestration has implementation and test evidence.
    status: BLOCKED_BY_PHASE_2_DELTA

  - task_id: P3-CONNECTED-DB-SAFETY-001
    goal: Harden connected-database safety flows for user query execution without weakening agent read-only constraints.
    dependencies:
      - P3-DELTA-PREREQ-001
    blocked_if:
      - audit pre-write behavior is NOT_VERIFIED
      - user_query_access_mode migration is NOT_VERIFIED
      - atomic high-risk confirmation is NOT_VERIFIED
      - real connected-database execution lacks explicit approval
    affected_files:
      - Apps/Api/
      - Audit/
      - State/
      - Tests/
      - Docs/Hermes_Execution/
    allowed_paths:
      - Apps/Api/
      - Audit/
      - State/
      - Tests/
      - Docs/Hermes_Execution/
    must_not_modify:
      - real connected database data
      - raw secrets
    inputs:
      - PHASE_2_SECURITY_SPEC.md
      - PHASE_3_SECURITY_SPEC.md
    outputs:
      - Connected DB safety evidence
    implementation_steps:
      - Wait for Phase 2 delta verification.
      - Use mock/stub DBs unless explicit real execution approval exists.
      - Validate permission, safety, confirmation, audit pre-write, and fail-closed behavior.
    acceptance_criteria:
      - Agent path remains read-only.
      - User query path is explicitly authorized and audited.
    test_cases:
      - Permission denied
      - High-risk confirmation replay
      - Audit pre-write failure blocks execution
    test_commands:
      - to_be_defined_after_prerequisites
    evidence_artifact: Docs/Hermes_Execution/PHASE_3_CONNECTED_DB_SAFETY_EVIDENCE.md
    rollback_strategy: Revert approved task files only.
    definition_of_done: Safety flow has implementation and test evidence.
    status: BLOCKED_BY_PHASE_2_DELTA

  - task_id: P3-PRODUCTION-DECISIONS-001
    goal: Resolve open decisions required before production or multi-worker claims.
    dependencies:
      - user product/security decisions
    blocked_if:
      - confirmation persistence backend undecided
      - runtime/audit generated artifact policy undecided
      - confirmation TTL/attempt limit undecided
      - Windows locking implementation undecided
      - audit retention duration undecided
    affected_files:
      - Docs/Hermes_Execution/
    allowed_paths:
      - Docs/Hermes_Execution/
    must_not_modify:
      - code directories
      - data directories
    inputs:
      - PHASE_2_ARTIFACT_CONSISTENCY_MATRIX.md
      - PHASE_3_PLAN.md
    outputs:
      - Recorded user decisions
    implementation_steps:
      - Ask user for each open decision.
      - Record decisions in a dedicated decision artifact.
    acceptance_criteria:
      - Decisions are explicit and traceable.
    test_cases:
      - Verify no implicit decision was invented.
    test_commands:
      - manual_doc_review
    evidence_artifact: Docs/Hermes_Execution/PHASE_3_USER_DECISIONS.md
    rollback_strategy: Replace decision artifact only with user approval.
    definition_of_done: User decisions recorded explicitly.
    status: BLOCKED_BY_USER_DECISION

  - task_id: P3-VALIDATION-HARNESS-001
    goal: Build a broader Phase 3 validation harness after prerequisites are verified.
    dependencies:
      - P3-DELTA-PREREQ-001
      - P3-RUNTIME-ORCHESTRATION-001
      - P3-CONNECTED-DB-SAFETY-001
    blocked_if:
      - Phase 2 delta prerequisites remain NOT_VERIFIED
      - Phase 3 implementation tasks remain blocked
    affected_files:
      - Tests/
      - Docs/Hermes_Execution/
    allowed_paths:
      - Tests/
      - Docs/Hermes_Execution/
    must_not_modify:
      - real connected database data
      - production secrets
    inputs:
      - implementation evidence artifacts
    outputs:
      - validation harness and results
    implementation_steps:
      - Wait for implementation evidence.
      - Add tests for orchestration and safety flows.
      - Run tests and record results.
    acceptance_criteria:
      - Tests cover ready implemented Phase 3 scope.
    test_cases:
      - to_be_defined_after_implementation
    test_commands:
      - to_be_defined_after_implementation
    evidence_artifact: Docs/Hermes_Execution/PHASE_3_VALIDATION_EVIDENCE.md
    rollback_strategy: Remove harness files created by this task if user requests rollback.
    definition_of_done: Validation harness runs successfully against implemented scope.
    status: DEFERRED
