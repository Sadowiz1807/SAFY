dispatch_rules:
- No sub-agent may start a task unless dispatchable is true.
- Terminal or historical tasks must always have dispatchable false and dispatchable_now false.
- Phase status `planned_ready_not_dispatched` means documentation is ready but execution is not authorized.
- Hermes cannot dispatch a task if any required schema field is missing or empty.
- Future high-level tasks must use dispatchable false and status planned_placeholder.
- Hermes must expand placeholder tasks before starting that phase.
