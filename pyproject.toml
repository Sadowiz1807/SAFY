[project]
name = "safy"
version = "1.2.0"
description = "SAFY: Local AI Database Agent and Database Safety Gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "pypdf",
    "python-docx",
]

[project.scripts]
safy = "Apps.Api.safy_api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Agent*",
    "Apps*",
    "Configs*",
    "Audit*",
    "Core*",
    "DataStore*",
    "DomainIntelligence*",
    "Gateway*",
    "LLM*",
    "Logging*",
    "Sandbox*",
    "State*",
    "Skills*",
    "Tools*",
    "Toolsets*",
]
exclude = ["Tests*", "Docs*", "Scripts*"]
namespaces = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"Apps" = [
    "Web/*.html",
    "Web/*.js",
    "Web/*.css",
]
"Configs" = [
    "*.yaml",
    "*.yml",
    "*.json",
    "*.md",
]
"Skills" = [
    "*/SKILL.md",
    "*/output.schema.json",
    "*/references/*.md",
]
"DomainIntelligence" = [
    "README.md",
    "MIGRATION.md",
    "packs/registry.json",
    "packs/*/*/*.safy-domain",
    "reports/*.json",
]


[project.optional-dependencies]
dev = ["pytest"]
db = ["pymysql", "psycopg[binary]", "pyodbc", "oracledb"]
