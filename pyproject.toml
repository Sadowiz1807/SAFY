[project]
name = "safy"
version = "1.1.0"
description = "SAFY: Local AI Database Agent and Database Safety Gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
]

[project.scripts]
safy = "Apps.Api.safy_api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Agent*",
    "Apps*",
    "Audit*",
    "Core*",
    "DataStore*",
    "Gateway*",
    "LLM*",
    "Logging*",
    "Providers*",
    "Sandbox*",
    "State*",
    "Tools*",
    "Toolsets*",
]
exclude = ["Tests*", "Docs*", "Scripts*"]
namespaces = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
