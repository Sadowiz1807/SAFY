[project]
name = "safy"
version = "1.1.0"
description = "SAFY: Local AI Database Agent and Database Safety Gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
]

[project.scripts]
safy = "Apps.Api.safy_api.cli:main"

[tool.setuptools]
packages = [
    "Apps",
    "Core",
    "Audit",
    "State",
    "Tools",
    "Skills",
    "Configs",
    "Gateway",
    "Logging",
    "Sandbox",
    "Toolsets",
    "DataStore",
    "Providers",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
